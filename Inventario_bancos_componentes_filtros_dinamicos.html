<style>

.controls{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:2fr 1fr 1.35fr 1.35fr 1.35fr auto;gap:10px;position:sticky;top:8px;z-index:4;box-shadow:var(--shadow)}input,select,button{font:inherit;border:1px solid #c8d0dc;border-radius:9px;padding:10px;background:#fff;color:var(--text)}button{cursor:pointer}button.primary{background:var(--brand2);color:#fff;border-color:var(--brand2)}button:hover{filter:brightness(.98)}
.bankHint{margin:7px 4px 0;color:var(--muted);font-size:12px}.summary{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px;color:var(--muted);gap:10px}.viewBtns{display:flex;gap:7px}.viewBtns button.active{background:#dceefc;color:#004b81;border-color:#82bce5}

const norm=s=>(s??'').toString().toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selectedBanks=new Set();
function searchMatch(x){const q=norm($('#q').value);return !q||norm(FIELDS.map(k=>x[k]).join(' ')).includes(q)}
function passes(x,omit=''){const st=$('#status').value,f=$('#family').value,l=$('#loc').value;if(!searchMatch(x))return false;if(omit!=='status'&&st&&(st==='free')!==x._libre)return false;if(omit!=='bank'&&selectedBanks.size&&!selectedBanks.has(x.Banco))return false;if(omit!=='family'&&f&&x.Familia!==f)return false;if(omit!=='loc'&&l&&x['Ubicación']!==l)return false;return true}
function filtered(){return DATA.filter(x=>passes(x))}
function countsFor(facet){const m=new Map;for(const x of DATA.filter(y=>passes(y,facet))){let v=facet==='status'?(x._libre?'free':'assigned'):facet==='bank'?x.Banco:facet==='family'?x.Familia:x['Ubicación'];if(v&&v!=='-')m.set(v,(m.get(v)||0)+1)}return m}
function refillSelect(id,facet,allLabel){const el=$('#'+id),old=el.value,map=countsFor(facet),labels=[...map.keys()].sort((a,b)=>a.localeCompare(b,'es'));el.innerHTML=`<option value="">${allLabel}</option>`+labels.map(v=>`<option value="${esc(v)}">${esc(v)} (${map.get(v)})</option>`).join('');el.value=map.has(old)?old:'';return old===el.value}
function updateStatus(){const el=$('#status'),old=el.value,map=countsFor('status');el.innerHTML='<option value="">Todos</option>'+[['assigned','Asignados'],['free','Libres / sin banco']].filter(([v])=>map.has(v)).map(([v,t])=>`<option value="${v}">${t} (${map.get(v)})</option>`).join('');el.value=map.has(old)?old:'';return old===el.value}
function updateBankOptions(){const map=countsFor('bank');let changed=false;for(const b of [...selectedBanks])if(!map.has(b)){selectedBanks.delete(b);changed=true}const q=norm($('#bankSearch').value),vals=[...map.keys()].filter(v=>norm(v).includes(q)).sort((a,b)=>a.localeCompare(b,'es'));$('#bankOptions').innerHTML=vals.length?vals.map(v=>`<label class="bankOption"><input type="checkbox" value="${esc(v)}" ${selectedBanks.has(v)?'checked':''}><span>${esc(v)}</span><small>${map.get(v)}</small></label>`).join(''):'<div class="facetEmpty">No hay bancos compatibles</div>';$('#bankOptions').querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{cb.checked?selectedBanks.add(cb.value):selectedBanks.delete(cb.value);refresh()}));updateBankSummary();return !changed}
function updateBankSummary(){const n=selectedBanks.size,arr=[...selectedBanks];$('#bankButtonText').textContent=!n?'Todos los bancos':n===1?arr[0]:`${n} bancos seleccionados`;$('#bankButton').classList.toggle('hasSelection',n>0);$('#selectedBanks').innerHTML=arr.map(v=>`<span class="bankChip">${esc(v)}<button type="button" data-bank="${esc(v)}" aria-label="Quitar ${esc(v)}">×</button></span>`).join('');$('#selectedBanks').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selectedBanks.delete(b.dataset.bank);refresh()}))}
function updateFacets(){for(let i=0;i<3;i++){const stable=[updateStatus(),refillSelect('family','family','Todas las familias'),refillSelect('loc','loc','Todas las ubicaciones'),updateBankOptions()].every(Boolean);if(stable)break}}
function refresh(){updateFacets();render()}
function groups(rows){const m=new Map;for(const x of rows){const k=x._banco_normalizado;if(!m.has(k))m.set(k,[]);m.get(k).push(x)}return [...m.entries()].sort((a,b)=>a[0]==='LIBRE / SIN BANCO'?-1:b[0]==='LIBRE / SIN BANCO'?1:a[0].localeCompare(b[0],'es'));}
function badge(x){return x._libre?'<span class="freeBadge">LIBRE / SIN BANCO</span>':'<span class="assignedBadge">ASIGNADO</span>'}
function card(x,i){return `<article class="card" data-i="${i}">${badge(x)}<h3>${esc(x.Familia||'Sin familia')}</h3><div class="code">${esc(x.Código||'Sin código')}</div><div class="meta">${esc([x.Fabricante,x.Modelo].filter(Boolean).join(' · ')||'Sin fabricante/modelo')}</div><div class="tags"><span class="tag">${esc(x['Ubicación']||'Sin ubicación')}</span>${x['Nº de serie']?`<span class="tag">S/N ${esc(x['Nº de serie'])}</span>`:''}${x.Responsable&&x.Responsable!=='-'?`<span class="tag">${esc(x.Responsable)}</span>`:''}${x['Estado PC']?`<span class="stateBadge">${esc(x['Estado PC'])}</span>`:''}</div></article>`}
function table(rows){return `<div class="tableWrap"><table><thead><tr>${['Estado','Código','Familia','Fabricante / Modelo','Nº de serie','Asignación','Responsable','Ubicación','Estado PC'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(x=>`<tr data-i="${DATA.indexOf(x)}"><td>${badge(x)}</td><td class="code">${esc(x.Código)}</td><td>${esc(x.Familia)}</td><td>${esc([x.Fabricante,x.Modelo].filter(Boolean).join(' · '))}</td><td>${esc(x['Nº de serie'])}</td><td>${esc(x['Asignación'])}</td><td>${esc(x.Responsable)}</td><td>${esc(x['Ubicación'])}</td><td>${esc(x['Estado PC'])}</td></tr>`).join('')}</tbody></table></div>`}
function render(){const rows=filtered(),gs=groups(rows);$('#resultCount').textContent=`${rows.length} de ${DATA.length} componentes · ${gs.length} grupos`;$('#results').innerHTML=rows.length?gs.map(([name,items])=>`<details class="group" open><summary>${name==='LIBRE / SIN BANCO'?'<span class="freeBadge">LIBRES</span>':'<span class="assignedBadge">BANCO</span>'}<span>${esc(name)}</span><span class="count">${items.length}</span></summary>${view==='cards'?`<div class="cards">${items.map(x=>card(x,DATA.indexOf(x))).join('')}</div>`:table(items)}</details>`).join(''):'<div class="empty">No hay componentes que coincidan con los filtros.</div>';document.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('click',()=>openDetail(DATA[+el.dataset.i])));}
function openDetail(x){$('#dlgStatus').innerHTML=badge(x);$('#dlgTitle').textContent=x.Código||x.Familia||'Componente';$('#dlgBody').innerHTML=FIELDS.map(k=>`<div class="field ${['Observación','Norma: EMP'].includes(k)?'full':''}"><b>${esc(k)}</b><span>${esc(x[k]||'—')}</span></div>`).join('')+`<div class="field"><b>Disponibilidad</b><span>${x._libre?'Libre / sin banco asignado':'Asignado al banco '+esc(x.Banco)}</span></div><div class="field"><b>Fila de origen</b><span>${x._fila}</span></div>`;$('#detail').showModal();}
['q','status','family','loc'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',refresh));
$('#bankButton').addEventListener('click',()=>{const menu=$('#bankMenu'),willOpen=menu.hidden;menu.hidden=!willOpen;$('#bankButton').setAttribute('aria-expanded',String(willOpen));if(willOpen){$('#bankSearch').focus();updateBankOptions()}});
$('#bankSearch').addEventListener('input',updateBankOptions);$('#clearBanks').addEventListener('click',()=>{selectedBanks.clear();refresh()});document.addEventListener('click',e=>{if(!$('#bankMulti').contains(e.target)){$('#bankMenu').hidden=true;$('#bankButton').setAttribute('aria-expanded','false')}});
$('#clear').addEventListener('click',()=>{$('#q').value='';$('#status').value='';$('#family').value='';$('#loc').value='';$('#bankSearch').value='';selectedBanks.clear();refresh()});
$('#cardsBtn').addEventListener('click',()=>{view='cards';$('#cardsBtn').classList.add('active');$('#tableBtn').classList.remove('active');render()});$('#tableBtn').addEventListener('click',()=>{view='table';$('#tableBtn').classList.add('active');$('#cardsBtn').classList.remove('active');render()});$('#expandBtn').addEventListener('click',()=>{const ds=[...document.querySelectorAll('details')],open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open);$('#expandBtn').textContent=open?'Contraer todo':'Expandir todo'});$('.close').addEventListener('click',()=>$('#detail').close());$('#detail').addEventListener('click',e=>{if(e.target===$('#detail'))$('#detail').close()});refresh();</script></body></html>
