# Configuración por defecto de TestBenchPlanner.
# Cualquier valor se puede cambiar al arrancar: --planner.almacen=sharepoint, etc.
server:
  port: 5001
  address: 127.0.0.1          # solo accesible desde este PC, como la 4.9.4

planner:
  almacen: local              # local | sharepoint
  fecha-fija: ""              # aaaa-mm-dd para reproducir un día concreto
  carpeta-usuario: ${user.home}/.testbenchplanner

  listas:
    # D11: no se guarda una lista compartida (bancos, proyectos, usuarios,
    # recursos) si su lectura falló o llegó vacía, ni se deja vacía.
    # true solo para una instalación nueva con las listas vacías.
    permitir-vacias: false

  local:
    carpeta-datos: ${planner.carpeta-usuario}/datos-locales
    escenario-inicial: ../datos/escenarios/sharepoint-2026-11-05
    reiniciar-al-arrancar: false
    usuario-email: laboratorio@ejemplo.local
    usuario-nombre: Laboratorio

  sharepoint:
    # La URL del sitio NO se guarda en el repositorio: indícala en
    # config/application-sharepoint.yml junto al ejecutable o con --planner.sharepoint.sitio=…
    sitio: ""
    sitio-aprobaciones: ""
    lista-aprobaciones: "Services approvals database V2"
    escritura-habilitada: false   # ¡por defecto NO se escribe nada en SharePoint!
    publicar-version: false       # solo al distribuir la versión al equipo
    puerto-depuracion: 9222
    carpeta-perfil-edge: ${planner.carpeta-usuario}/.edge_profile
    espejo-habilitado: true
    # Conexiones de SOLO LECTURA con Edge en paralelo a la principal (que hace
    # todas las escrituras). Así las consultas (estados de aprobación, recursos…)
    # no esperan detrás de la carga de la planificación ni de los guardados.
    # 0 = todo por una sola conexión, como en versiones anteriores.
    carriles-lectura: 2

  facturacion:
    # Dónde se guardan periodos, maestros, auditoría y exportaciones de la facturación.
    #   local      -> ficheros de este PC (modo local: <carpeta-datos>/facturacion;
    #                 con SharePoint: <carpeta-usuario>/facturacion). Por defecto.
    #   sharepoint -> carpeta compartida de una biblioteca del sitio (hay que crearla antes
    #                 e indicarla en carpeta-sharepoint; necesita escritura-habilitada).
    # Los datos de cada ensayo (horas, paradas, setup, HV, orden…) van siempre en
    # DataJson.billing de la lista de ensayos, como el resto de la ficha.
    almacen: local
    carpeta-sharepoint: ""        # p. ej. "Shared Documents/TestBenchPlanner/Facturacion"

spring:
  mvc:
    # Una petición abandonada por el navegador (recarga) no es un error que avisar.
    log-resolved-exception: false

logging:
  level:
    root: INFO
